<div class="card">
  <div class="card-header">
    <h2 class="card-title">Buat Draf Surat Baru</h2>
    <button class="btn btn-secondary" onclick="navigateTo('dashboard')">← Kembali ke Dashboard</button>
  </div>

  <form id="create-letter-form" onsubmit="handleDraftSubmit(event)">
    <!-- 1. Pilihan Template -->
    <div class="form-group">
      <label class="form-label" for="template-select">Pilih Jenis Surat Dinamis</label>
      <select id="template-select" class="form-control" onchange="onTemplateChange()" required>
        <option value="">-- Pilih Jenis Surat --</option>
        <option value="SP1" data-name="Surat Peringatan 1">Surat Peringatan 1 (SP1)</option>
        <option value="ST" data-name="Surat Tugas">Surat Tugas (ST)</option>
        <option value="SK" data-name="Surat Keputusan">Surat Keputusan (SK)</option>
      </select>
    </div>

    <!-- 2. Formulir Variabel Template -->
    <div id="dynamic-fields-container" style="display: none; background: #f8fafc; padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 1.5rem;">
      <h3 id="template-fields-title" style="font-size: 1rem; margin-bottom: 1rem; color: #1e293b;">Data Naskah Surat</h3>
      <div id="template-fields-content">
        <!-- Rendered based on selected template -->
      </div>
    </div>

    <!-- 3. Seleksi Peninjau (Reviewer) Dinamis -->
    <div class="form-group" style="margin-top: 1.5rem;">
      <div class="d-flex justify-between align-center mb-2">
        <label class="form-label mb-0">Rangkaian Peninjau Berjenjang (Reviewer)</label>
        <button type="button" class="btn btn-secondary" style="padding: 0.3rem 0.75rem; font-size: 0.8rem;" onclick="addReviewerRow()">
          + Tambah Reviewer
        </button>
      </div>
      <p class="text-muted" style="font-size: 0.8rem; margin-bottom: 0.75rem;">
        Peninjau akan memeriksa dan menyetujui surat secara berurutan sesuai urutan di bawah ini sebelum sampai ke Approver akhir.
      </p>
      <div id="reviewers-list-container">
        <!-- Reviewer dropdowns added here -->
      </div>
    </div>

    <!-- 4. Seleksi Approver Akhir -->
    <div class="form-group" style="margin-top: 1.5rem;">
      <label class="form-label" for="approver-select">Pejabat Pengesah Akhir (Approver) <span style="color: var(--danger);">*</span></label>
      <select id="approver-select" class="form-control" required>
        <option value="">-- Pilih Approver Akhir --</option>
      </select>
      <p class="text-muted" style="font-size: 0.75rem; margin-top: 0.25rem;">
        Approver akhir berhak menentukan metode tanda tangan (digital/basah) dan menerbitkan PDF resmi.
      </p>
    </div>

    <!-- 5. Tombol Aksi -->
    <div class="d-flex justify-between align-center" style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.25rem;">
      <button type="button" class="btn btn-secondary" onclick="navigateTo('dashboard')">Batal</button>
      <button type="submit" id="btn-submit-draft" class="btn btn-primary">
        <span>Terbitkan Nomor & Ajukan Draf</span>
      </button>
    </div>
  </form>
</div>

<script>
  let availableCandidates = [];

  /**
   * Initializes create letter form and loads candidates from server.
   */
  function initCreateLetterForm() {
    const form = document.getElementById('create-letter-form');
    if (form) form.reset();
    document.getElementById('dynamic-fields-container').style.display = 'none';
    document.getElementById('reviewers-list-container').innerHTML = '';

    callServer('listUsers')
      .then(users => {
        // U1 Remediation: Keluarkan pembuat draf (current user) dari kandidat Reviewer & Approver
        const myEmail = (AppState.currentUser ? AppState.currentUser.email : '').toLowerCase().trim();
        availableCandidates = (users || []).filter(u => u.isActive && u.email.toLowerCase().trim() !== myEmail);

        populateApproverDropdown();
      })
      .catch(err => {
        console.warn('Gagal memuat kandidat pengguna:', err);
        showToast('Gagal memuat daftar pengguna: ' + err.message, 'danger');
      });
  }

  function populateApproverDropdown() {
    const approverSelect = document.getElementById('approver-select');
    if (!approverSelect) return;

    approverSelect.innerHTML = '<option value="">-- Pilih Approver Akhir --</option>';
    // Approvers or Admins
    const approvers = availableCandidates.filter(u => u.role === 'approver' || u.role === 'admin');
    approvers.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.email;
      opt.textContent = `${u.name || u.email} (${u.email}) - ${u.role}`;
      opt.dataset.name = u.name || u.email;
      opt.dataset.role = u.role;
      approverSelect.appendChild(opt);
    });
  }

  /**
   * Updates dynamic input fields based on selected template.
   */
  function onTemplateChange() {
    const select = document.getElementById('template-select');
    const container = document.getElementById('dynamic-fields-container');
    const fieldsContent = document.getElementById('template-fields-content');
    const code = select.value;

    if (!code) {
      container.style.display = 'none';
      return;
    }

    container.style.display = 'block';
    let html = '';

    if (code === 'SP1') {
      html = `
        <div class="form-group">
          <label class="form-label">Nama Karyawan yang Diberi Sanksi <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="namaKaryawan" required placeholder="Contoh: Ahmad Dani">
        </div>
        <div class="form-group">
          <label class="form-label">Nomor Induk Karyawan (NIK) <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="nik" required placeholder="Contoh: HR-2024-009">
        </div>
        <div class="form-group">
          <label class="form-label">Departemen / Divisi <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="departemen" required placeholder="Contoh: Operasional">
        </div>
        <div class="form-group">
          <label class="form-label">Uraian Pelanggaran Tata Tertib <span style="color:var(--danger)">*</span></label>
          <textarea class="form-control" name="pelanggaran" required placeholder="Uraikan jenis tindakan atau pelanggaran disiplin..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Tanggal Mulai Efektif Berlaku <span style="color:var(--danger)">*</span></label>
          <input type="date" class="form-control" name="tanggalEfektif" required>
        </div>
      `;
    } else if (code === 'ST') {
      html = `
        <div class="form-group">
          <label class="form-label">Nama Petugas yang Ditugaskan <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="namaKaryawan" required placeholder="Contoh: Siti Rahmawati">
        </div>
        <div class="form-group">
          <label class="form-label">Nomor Induk Karyawan (NIK) <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="nik" required placeholder="Contoh: OPS-2023-014">
        </div>
        <div class="form-group">
          <label class="form-label">Lokasi / Kota Tujuan Tugas <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="lokasiTugas" required placeholder="Contoh: Kantor Cabang Surabaya">
        </div>
        <div class="form-group">
          <label class="form-label">Agenda & Deskripsi Penugasan <span style="color:var(--danger)">*</span></label>
          <textarea class="form-control" name="agendaTugas" required placeholder="Uraikan kegiatan kedinasan yang akan dilaksanakan..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Rentang Waktu Tugas <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="rentangWaktu" required placeholder="Contoh: 1 Oktober 2026 s/d 5 Oktober 2026">
        </div>
      `;
    } else if (code === 'SK') {
      html = `
        <div class="form-group">
          <label class="form-label">Nama Karyawan Subjek Keputusan <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="namaKaryawan" required placeholder="Contoh: Bambang Hermanto">
        </div>
        <div class="form-group">
          <label class="form-label">Nomor Induk Karyawan (NIK) <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="nik" required placeholder="Contoh: MGR-2022-003">
        </div>
        <div class="form-group">
          <label class="form-label">Perihal Ketetapan Keputusan <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-control" name="perihalKetetapan" required placeholder="Contoh: Pengangkatan Karyawan Tetap">
        </div>
        <div class="form-group">
          <label class="form-label">Dasar Pertimbangan SK <span style="color:var(--danger)">*</span></label>
          <textarea class="form-control" name="dasarPertimbangan" required placeholder="Menimbang kinerja dan pencapaian..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Tanggal Mulai Berlaku <span style="color:var(--danger)">*</span></label>
          <input type="date" class="form-control" name="tanggalEfektif" required>
        </div>
      `;
    }

    fieldsContent.innerHTML = html;
  }

  /**
   * Adds a reviewer row.
   */
  function addReviewerRow() {
    const container = document.getElementById('reviewers-list-container');
    const rowId = 'rev-row-' + Date.now();
    const orderNum = container.children.length + 1;

    let optionsHtml = '<option value="">-- Pilih Peninjau (Reviewer) --</option>';
    availableCandidates.forEach(u => {
      optionsHtml += `<option value="${escapeHtml(u.email)}" data-name="${escapeHtml(u.name || u.email)}" data-role="${escapeHtml(u.role)}">${escapeHtml(u.name || u.email)} (${escapeHtml(u.email)}) - ${escapeHtml(u.role)}</option>`;
    });

    const row = document.createElement('div');
    row.id = rowId;
    row.className = 'd-flex gap-2 align-center mb-2';
    row.innerHTML = `
      <span class="user-role-tag" style="min-width: 70px; text-align: center;">Tahap ${orderNum}</span>
      <select class="form-control reviewer-select" required>
        ${optionsHtml}
      </select>
      <button type="button" class="btn btn-secondary" style="padding: 0.5rem 0.75rem; color: var(--danger);" onclick="removeReviewerRow('${rowId}')">✕</button>
    `;

    container.appendChild(row);
  }

  function removeReviewerRow(rowId) {
    const row = document.getElementById(rowId);
    if (row) row.remove();

    // Re-index remaining rows
    const container = document.getElementById('reviewers-list-container');
    Array.from(container.children).forEach((child, idx) => {
      const tag = child.querySelector('.user-role-tag');
      if (tag) tag.textContent = `Tahap ${idx + 1}`;
    });
  }

  /**
   * Submits draft to server.
   */
  function handleDraftSubmit(e) {
    e.preventDefault();

    const templateSelect = document.getElementById('template-select');
    const selectedOpt = templateSelect.options[templateSelect.selectedIndex];
    const templateCode = templateSelect.value;
    const templateType = selectedOpt.dataset.name || selectedOpt.text;

    // Gather dynamic fields
    const contentData = {};
    const inputs = document.querySelectorAll('#template-fields-content input, #template-fields-content textarea');
    inputs.forEach(inp => {
      if (inp.name) {
        contentData[inp.name] = inp.value.trim();
      }
    });

    // Gather Reviewers
    const reviewers = [];
    const revSelects = document.querySelectorAll('.reviewer-select');
    for (const sel of revSelects) {
      if (sel.value) {
        const opt = sel.options[sel.selectedIndex];
        reviewers.push({
          email: sel.value,
          name: opt.dataset.name || sel.value,
          role: 'reviewer'
        });
      }
    }

    // Gather Approver
    const approverSelect = document.getElementById('approver-select');
    const approverOpt = approverSelect.options[approverSelect.selectedIndex];
    if (!approverSelect.value) {
      showToast('Approver akhir wajib dipilih!', 'danger');
      return;
    }

    const approver = {
      email: approverSelect.value,
      name: approverOpt.dataset.name || approverSelect.value,
      role: 'approver'
    };

    const payload = {
      templateCode,
      templateType,
      contentData,
      reviewers,
      approver
    };

    const submitBtn = document.getElementById('btn-submit-draft');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> <span>Memproses Nomor & Draf...</span>';

    callServer('submitDraft', payload)
      .then(res => {
        showToast(`Draf berhasil dibuat dengan nomor resmi: ${res.letterNumber}`, 'success');
        navigateTo('detail', res.letterId);
      })
      .catch(err => {
        showToast('Gagal mengajukan draf: ' + err.message, 'danger');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Terbitkan Nomor & Ajukan Draf</span>';
      });
  }
</script>
