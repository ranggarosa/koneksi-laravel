<script>
  /**
   * Client-side State & Controller for Koneksi
   */
  const AppState = {
    currentUser: null,
    activePage: 'dashboard',
    activeLetterId: null,
    allUsers: []
  };

  /**
   * Promise wrapper for google.script.run
   * @param {string} functionName
   * @param {...*} args
   * @return {Promise<*>}
   */
  function callServer(functionName, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        console.warn(`[MockServerCall] google.script.run is not available for ${functionName}`);
        reject(new Error('google.script.run tidak tersedia di lingkungan ini.'));
        return;
      }

      google.script.run
        .withSuccessHandler((response) => {
          if (response && response.success === false) {
            reject(new Error(response.message || response.error || 'Terjadi kesalahan pada server.'));
          } else {
            resolve(response && response.data !== undefined ? response.data : response);
          }
        })
        .withFailureHandler((error) => {
          console.error(`Error calling ${functionName}:`, error);
          reject(new Error(error.message || String(error)));
        })[functionName](...args);
    });
  }

  /**
   * Sanitizes text to prevent Cross-Site Scripting (XSS).
   * @param {string} text
   * @return {string}
   */
  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  /**
   * Displays toast notification.
   * @param {string} message
   * @param {'success'|'danger'|'warning'|'info'} type
   */
  function showToast(message, type = 'info') {
    const toast = document.getElementById('global-toast');
    if (!toast) return;

    toast.className = `alert alert-${type}`;
    toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
    toast.style.display = 'flex';

    setTimeout(() => {
      toast.style.display = 'none';
    }, 4500);
  }

  /**
   * Router to switch between views.
   * @param {string} page 'dashboard' | 'create' | 'detail' | 'settings' | 'login'
   * @param {string} [param] optional parameter like letterId
   */
  function navigateTo(page, param = null) {
    AppState.activePage = page;
    if (param) AppState.activeLetterId = param;

    // Hide all view pages
    const pages = ['dashboard', 'create', 'detail', 'settings', 'login'];
    pages.forEach(p => {
      const el = document.getElementById(`view-${p}`);
      if (el) el.style.display = 'none';
      const navItem = document.getElementById(`nav-${p}`);
      if (navItem) navItem.classList.remove('active');
    });

    // Show target view
    const targetEl = document.getElementById(`view-${page}`);
    if (targetEl) targetEl.style.display = 'block';

    const targetNav = document.getElementById(`nav-${page}`);
    if (targetNav) targetNav.classList.add('active');

    // Trigger page-specific loaders
    if (page === 'dashboard' && typeof loadDashboardLetters === 'function') {
      loadDashboardLetters();
    } else if (page === 'create' && typeof initCreateLetterForm === 'function') {
      initCreateLetterForm();
    } else if (page === 'detail' && typeof loadLetterDetail === 'function') {
      loadLetterDetail(AppState.activeLetterId);
    } else if (page === 'settings' && typeof initSettingsPage === 'function') {
      initSettingsPage();
    }
  }

  /**
   * Opens modal by ID.
   */
  function openModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.classList.add('show');
  }

  /**
   * Closes modal by ID.
   */
  function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.classList.remove('show');
  }

  /**
   * App initialization on window load.
   */
  document.addEventListener('DOMContentLoaded', () => {
    callServer('getCurrentUser')
      .then(user => {
        AppState.currentUser = user;
        
        // Update user badge in navbar
        const userBadge = document.getElementById('user-badge-container');
        if (userBadge) {
          userBadge.innerHTML = `
            <span>${escapeHtml(user.name || user.email)}</span>
            <span class="user-role-tag">${escapeHtml(user.role)}</span>
          `;
          userBadge.style.display = 'flex';
        }

        // Adjust navigation links based on role
        const navCreate = document.getElementById('nav-create');
        if (navCreate) {
          navCreate.style.display = (user.role === 'drafter' || user.role === 'admin') ? 'block' : 'none';
        }

        const navSettings = document.getElementById('nav-settings');
        if (navSettings) {
          navSettings.style.display = (user.role === 'admin' || user.role === 'approver') ? 'block' : 'none';
        }

        // Navigate to default page or requested query page
        const initialPage = window.INITIAL_PAGE || 'dashboard';
        const initialLetterId = window.INITIAL_LETTER_ID || null;
        navigateTo(initialPage, initialLetterId);
      })
      .catch(err => {
        console.error('Autentikasi gagal:', err);
        // Show login view with error message
        const loginMsg = document.getElementById('login-error-message');
        if (loginMsg) {
          loginMsg.textContent = err.message || 'Akses ditolak: akun tidak terdaftar pada whitelist.';
        }
        navigateTo('login');
      });
  });
</script>
